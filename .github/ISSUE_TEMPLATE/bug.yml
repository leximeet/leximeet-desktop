name: 缺陷报告
description: 提供可复现的行为与最小脱敏资料
body:
  - type: input
    id: version
    attributes:
      label: 版本与系统
      description: Desktop、Browser、操作系统与 CPU；是否使用隔离脚本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与预期/实际结果
      description: 不附个人数据库、凭证或未脱敏语境；安全问题使用私密渠道
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或日志
      description: 说明独立/连接模式，首次安装或继续资料，已运行的测试
