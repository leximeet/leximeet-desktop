name: Desktop local workflow

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: "可选：发行任务固定的源码提交；未指定时检查当前事件源码"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  lint:
    name: Format, documents and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          ok=0
          for attempt in 1 2 3; do
            if npm ci; then ok=1; break; fi
            sleep $((attempt * 4))
          done
          test "$ok" = 1
      - name: Verify formatting and public documents
        run: |
          npm run format:check
          npm run docs:check
          npm audit --omit=dev --audit-level=high

  desktop:
    name: Desktop (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            suite: full
          - os: windows-2025
            arch: x64
            suite: core-cross
          - os: ubuntu-24.04
            arch: x64
            suite: core-cross
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Exclude Defender from Core unit-test copies only
        if: ${{ runner.os == 'Windows' && matrix.suite == 'core-cross' }}
        shell: pwsh
        run: |
          $tmp = Join-Path "${{ github.workspace }}" ".runtime/ci-tmp"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          echo "TMP=$tmp" >> $env:GITHUB_ENV
          echo "TEMP=$tmp" >> $env:GITHUB_ENV
          echo "TMPDIR=$tmp" >> $env:GITHUB_ENV
          $paths = @("${{ github.workspace }}", "${{ runner.temp }}", $tmp)
          foreach ($path in ($paths | Select-Object -Unique)) {
            if ($path) {
              try { Add-MpPreference -ExclusionPath $path } catch { Write-Warning $_ }
            }
          }
          foreach ($proc in @("java.exe", "javaw.exe")) {
            try { Add-MpPreference -ExclusionProcess $proc } catch { Write-Warning $_ }
          }
      - name: Check the acceptance architecture
        if: matrix.suite == 'full'
        run: node -e "if(process.arch !== 'arm64') throw new Error('macOS 完整门禁要求 arm64 runner')"
      - name: Run the isolated desktop gate
        if: matrix.suite == 'full'
        run: bash scripts/test-desktop.sh --verify
      - name: Run the cross-platform core gate
        if: matrix.suite == 'core-cross'
        run: |
          ok=0
          for attempt in 1 2 3; do
            if npm ci; then ok=1; break; fi
            sleep $((attempt * 4))
          done
          test "$ok" = 1
          node scripts/verify-cross.cjs
      - name: Verify actual Core Jar, SBOM and original license bytes
        run: python3 core-java/scripts/verify-release.py
      - name: Verify first install and seven-day usage
        if: matrix.suite == 'full'
        run: bash scripts/test-desktop.sh --journey --prepared
      - name: Build the current unsigned application directory
        if: matrix.suite == 'full'
        run: node scripts/package.cjs dir
      - name: Build current unsigned installers
        if: matrix.suite == 'core-cross'
        run: npm run package:dist
      - name: Verify actual packaged licenses, contract and source bytes
        run: |
          mkdir -p test-results/package-materials
          node scripts/verify-package-materials.cjs > test-results/package-materials/results.json
      - name: Verify bundled Java and actual application
        if: matrix.suite == 'full'
        run: npm run test:package:desktop
      - name: Upload installers for a clean-runner smoke
        if: matrix.suite == 'core-cross'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pkg-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/**/*.exe
            release/**/*.AppImage
            release/**/*.deb
          if-no-files-found: error
          retention-days: 3
      - name: Upload local workflow evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-local-workflow-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            test-results/desktop-001/
            playwright-report/desktop-001/
            playwright-report/desktop-001-package/
            core-java/target/surefire-reports/
            core-java/target/release-verification.json
            test-results/package-materials/
            test-results/daily-journey/
            playwright-report/daily-journey/
          if-no-files-found: warn
          retention-days: 14

  install-smoke:
    name: Install smoke (${{ matrix.os }}, ${{ matrix.kind }})
    needs: desktop
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            pkg: windows-2025-x64
            kind: nsis
          - os: ubuntu-24.04
            pkg: ubuntu-24.04-x64
            kind: deb
          - os: ubuntu-24.04
            pkg: ubuntu-24.04-x64
            kind: appimage
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pkg-${{ matrix.pkg }}
          path: pkg
      - name: Install Linux display for AppImage/deb launch
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libfuse2t64 || sudo apt-get install -y xvfb libfuse2
      - name: Locate installer
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const kind = process.env.KIND;
          const root = path.resolve('pkg');
          const files = [];
          const visit = (dir) => {
            for (const name of fs.readdirSync(dir)) {
              const full = path.join(dir, name);
              if (fs.statSync(full).isDirectory()) visit(full);
              else files.push(full);
            }
          };
          visit(root);
          const match = files.find((file) =>
            kind === 'nsis' ? /\.exe$/i.test(file) :
            kind === 'deb' ? /\.deb$/i.test(file) :
            /\.AppImage$/i.test(file));
          if (!match) throw new Error(`pkg 中没有 ${kind} 安装包`);
          fs.appendFileSync(process.env.GITHUB_ENV, `LEXIMEET_INSTALLER=${match}\nLEXIMEET_INSTALL_KIND=${kind}\n`);
          NODE
        env:
          KIND: ${{ matrix.kind }}
      - name: Confirm Windows Defender stays on for first launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $status = Get-MpComputerStatus
          if (-not $status.RealTimeProtectionEnabled) {
            throw "install-smoke 须在 Defender 实时保护开启时验证安装后启动，不能排除扫描"
          }
          Write-Host "RealTimeProtectionEnabled=$($status.RealTimeProtectionEnabled)"
      - name: L2 install, start, Core/MCP, uninstall
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/install-smoke.cjs
          else
            node scripts/install-smoke.cjs
          fi
